name: refresh-instagram-token

# Belt and braces. If you followed SETUP.md and issued a *system-user* token
# with no expiry, this workflow is a no-op you can delete. If you took the
# simpler long-lived-token route, this is the only thing standing between you
# and the pipeline dying silently on day 61.
#
# A long-lived token must be refreshed while it is at least 24h old and not yet
# expired. Once it lapses it cannot be recovered -- you have to re-authorise by
# hand. Running every 20 days gives two chances to catch a failure before that.

on:
  schedule:
    - cron: "0 6 */20 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh and report
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          RESP=$(curl -s -G "https://graph.instagram.com/refresh_access_token" \
            --data-urlencode "grant_type=ig_refresh_token" \
            --data-urlencode "access_token=$IG_TOKEN")

          EXPIRES=$(echo "$RESP" | jq -r '.expires_in // empty')

          if [ -z "$EXPIRES" ]; then
            MSG="🔑 Instagram token refresh FAILED. Re-authorise by hand within days or the pipeline stops. Response: $(echo "$RESP" | head -c 300)"
            STATUS=1
          else
            DAYS=$(( EXPIRES / 86400 ))
            MSG="🔑 Instagram token refreshed. Valid for ${DAYS} more days. Update the IG_TOKEN secret and the Worker secret with the new value."
            STATUS=0
          fi

          curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT" --data-urlencode "text=$MSG" > /dev/null

          echo "$MSG"
          exit $STATUS
