name: build-nightly-post

on:
  # Two crons, so a dropped run is not a missed day; the free tier drops them
  # under load. Both fire hours late -- 7 to 10 in November 2026 -- and
  # whichever comes first builds. The second makes only what the first did
  # not, judged by UTC day, so a backup that drifts past midnight in India
  # still counts for the day it was scheduled (src/guard.py).
  schedule:
    - cron: "0 4 * * *"     # 09:30 IST nominal, primary
    - cron: "0 9 * * *"     # 14:30 IST nominal, backup
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build without allowing the Worker to publish"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nightly-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40      # room for slow model calls; the worst case is checked in tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # A second run must never send a second card, burn a second story from
      # the ledger, or spend a second batch of memes on the same day -- nor
      # skip what the first run failed to make. Asked before the install, so
      # a run with nothing left to make ends in seconds.
      - name: What today's build still needs
        id: guard
        run: python -m src.guard

      - name: Install dependencies
        if: >-
          steps.guard.outputs.news != 'done'
          || steps.guard.outputs.flirt != 'done'
          || steps.guard.outputs.memes != 'done'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Build news card
        if: steps.guard.outputs.news != 'done'
        env:
          # Shadow mode unless the repository variable LIVE is exactly "true".
          # Set it at Settings -> Secrets and variables -> Actions -> Variables
          # when you finish the phase 3 shadow run. Keeping the switch out of
          # the code means going live -- or pulling the plug -- takes one click
          # and no commit.
          DRY_RUN: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.dry_run
                || vars.LIVE != 'true' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python -m src.pipeline

      # Runs even when the news build failed: the two accounts are independent,
      # and a dead news feed must not silence the other account.
      - name: Build tech-metaphor card
        if: steps.guard.outputs.flirt != 'done' && !cancelled()
        env:
          DRY_RUN: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.dry_run
                || vars.LIVE != 'true' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python -m src.pipeline_flirt

      # Today's trends turned into three finished memes. Runs whatever happened
      # above -- it reads the tech stories the news step left, and manages on
      # Google Trends alone when there are none.
      - name: Build meme ideas
        if: steps.guard.outputs.memes != 'done' && !cancelled()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python -m src.pipeline_memes

      # Runs even if a build step failed. The two accounts are independent: a
      # flirt build that refuses to run (say, its handle is not set yet) must
      # not throw away a news card that built fine. Each pipeline writes
      # post.json only after its card has rendered, so a failed step leaves
      # nothing half-made to commit.
      - name: Commit card and ledger
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "instapost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist state
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "post: $(TZ=Asia/Kolkata date +%F)"
          # Anything pushed to main while this job ran -- a code change, or a
          # line in .github/run-memes -- would otherwise make the push fail and
          # lose the ledger and the queue for cards that have already gone out.
          git pull --rebase origin main
          git push

      - name: Verify the image is publicly reachable
        if: ${{ !cancelled() }}
        # The parked publisher would have Meta fetch the image from this URL. If
        # it 404s, that post is already lost -- better to know now, while there
        # is still time to fix it, than to find out from a failed publish.
        run: |
          URL="https://raw.githubusercontent.com/${{ github.repository }}/main/dist/news/card.jpg"
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            case "$CODE" in
              200)
                echo "reachable"; exit 0 ;;
              429)
                # Throttling of *this runner's* IP says nothing about whether
                # Meta can fetch the file. Treat it as inconclusive, not as a
                # failure -- failing here would kill an otherwise good night.
                echo "::warning::HTTP 429 from raw.githubusercontent (runner throttled); skipping verification"
                exit 0 ;;
              *)
                echo "attempt $i: HTTP $CODE, retrying"; sleep 10 ;;
            esac
          done
          echo "::error::card.jpg not reachable at $URL"
          exit 1
