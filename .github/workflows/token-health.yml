name: instagram-token-health

# Confirms every ten days that the publishing token still works, and warns
# before it stops. The logic lives in src/token_health.py so it can be tested;
# that module explains why this never tries to renew the token, and why expiry
# is only visible when META_APP_ID and META_APP_SECRET are set.
#
# A failed check is reported as either BROKEN (Graph rejected the token) or
# INCONCLUSIVE (the check itself could not finish). They are never conflated:
# telling you to re-authorise a working token because the network blipped is
# how an alert learns to be ignored.

on:
  schedule:
    - cron: "0 6 */10 * *"     # days 1, 11, 21 and 31: never more than 11 days apart
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only, so there is nothing to install.
      - name: Check the token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          IG_USER_ID_NEWS: ${{ secrets.IG_USER_ID_NEWS }}
          IG_USER_ID_FLIRT: ${{ secrets.IG_USER_ID_FLIRT }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python -m src.token_health
