name: instagram-token-health

# Watches the access token and shouts before it dies. It deliberately does NOT
# try to refresh it.
#
# The workflow this replaced called graph.instagram.com/refresh_access_token
# with grant_type=ig_refresh_token. That was wrong twice over:
#
#   1. Wrong token family. The Worker publishes through
#      graph.facebook.com/{version}/{ig-user-id} -- the Facebook Login path --
#      whose tokens are not refreshed by the Instagram Login endpoint at all.
#
#   2. It could not keep what it fetched. refresh_access_token returns a *new*
#      token string; that job read only expires_in and discarded the token,
#      then advised updating the secret with a value it never revealed -- and
#      on a public repo it must never print one. So it renewed nothing while
#      looking like it did, which is worse than having no safety net.
#
# Persisting a new token would mean writing an encrypted GitHub secret AND a
# Cloudflare Worker secret from CI, which needs two more long-lived
# credentials to protect a third. The better answer is to not have an expiring
# token: issue a system-user token with expiry "Never" (SETUP.md phase A6).
# Then this workflow simply confirms, every 10 days, that it still works.

on:
  schedule:
    - cron: "0 6 */10 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the token and alert on trouble
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v21.0' }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          set -uo pipefail

          if [ -z "${IG_TOKEN:-}" ]; then
            echo "::error::IG_TOKEN secret is not set"; exit 1
          fi

          # debug_token reports validity and expiry for the token we actually
          # publish with. Inspecting a token with itself is supported.
          RESP=$(curl -s -G "https://graph.facebook.com/${GRAPH_VERSION}/debug_token" \
            --data-urlencode "input_token=$IG_TOKEN" \
            --data-urlencode "access_token=$IG_TOKEN")

          VALID=$(echo "$RESP"   | jq -r '.data.is_valid   // empty')
          EXPIRES=$(echo "$RESP" | jq -r '.data.expires_at // empty')

          if [ "$VALID" != "true" ]; then
            # Never echo the response: it can carry token material.
            ERR=$(echo "$RESP" | jq -r '.error.message // "token reported invalid"')
            MSG="🔑 Instagram token is INVALID: ${ERR}. Publishing is down until you re-authorise."
            STATUS=1
          elif [ -z "$EXPIRES" ] || [ "$EXPIRES" = "0" ]; then
            # expires_at 0 means no expiry -- the system-user token we want.
            MSG="🔑 Instagram token valid, no expiry set. Nothing to do."
            STATUS=0
          else
            DAYS=$(( (EXPIRES - $(date +%s)) / 86400 ))
            if [ "$DAYS" -lt 14 ]; then
              MSG="🔑 Instagram token expires in ${DAYS} days. Re-issue it now — once it lapses it cannot be recovered and both accounts stop posting."
              STATUS=1
            else
              MSG="🔑 Instagram token valid for ${DAYS} more days."
              STATUS=0
            fi
          fi

          if [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              -d "chat_id=$TG_CHAT" --data-urlencode "text=$MSG" > /dev/null || true
          fi

          echo "$MSG"
          exit $STATUS
