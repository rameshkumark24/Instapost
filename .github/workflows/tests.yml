name: tests

# The nightly build runs unattended and publishes publicly. A regression that
# reaches it is seen by an audience before it is seen by us, so the tests run
# on every push rather than only before a release.

on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"        # the bot's own nightly commits change nothing testable
      - "state/**"
      - "*.html"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Chromium is installed because rendering is tested too: a card whose
      # text was fitted to the fallback font overflowed its margin once the
      # real font loaded, and only a rendered card shows that.
      - run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - run: python -m unittest discover -s tests -v

  # The publisher is the one component that talks to Instagram. Its tests
  # script every network call, so they need nothing but Node.
  publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test the publisher
        working-directory: worker
        run: node --test
